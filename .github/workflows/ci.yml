name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check ledgerloop eval tests

      - name: Type check
        run: mypy ledgerloop/money.py ledgerloop/generate/fee_model.py ledgerloop/llm/contract.py

      - name: Test
        run: pytest --cov=ledgerloop --cov-report=term-missing

      # §12's bar for day 13 is "fresh clone -> make demo works". This is that check,
      # on every push rather than once by hand. No API key is configured in this
      # workflow, deliberately: Tier 3 must run entirely from the committed response
      # cache, which is the claim ADR-026 makes and which was broken until day 13.
      - name: Demo (fresh clone, no API key)
        run: make demo

      # The README's results table and the HTML report are both generated, never typed
      # (rule 7). Regenerating them from the committed cache must leave the working tree
      # untouched -- a diff here means either someone hand-edited a number, or the numbers
      # moved and the artefacts were not regenerated. Both are release blockers.
      #
      # `make demo` above already rewrote results/report.html, so this step covers it too:
      # the page is reproducible from the cache on a machine with no API key.
      - name: Results table is generated, not hand-written
        run: |
          ledgerloop evaluate --all-fixtures --out results/metrics.md
          git diff --exit-code -- README.md results/
