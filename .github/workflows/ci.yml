name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check ledgerloop eval tests

      - name: Type check
        run: mypy ledgerloop/money.py ledgerloop/generate/fee_model.py ledgerloop/llm/contract.py

      - name: Test
        run: pytest --cov=ledgerloop --cov-report=term-missing
